<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
 <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8e2a5f"/><stop offset="1" stop-color="#561436"/></linearGradient>
  <linearGradient id="drum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a63c9"/><stop offset=".5" stop-color="#1e4fa8"/><stop offset="1" stop-color="#153a82"/></linearGradient>
  <linearGradient id="liq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d0902e"/><stop offset="1" stop-color="#8a4f10"/></linearGradient>
  <radialGradient id="glow" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff" stop-opacity=".18"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
 </defs>
 <rect width="512" height="512" rx="112" fill="url(#bg)"/>
 <rect width="512" height="512" rx="112" fill="url(#glow)"/>
 <!-- drum body -->
 <path d="M128 150 h256 v250 a34 34 0 0 1 -34 34 h-188 a34 34 0 0 1 -34 -34z" fill="url(#drum)"/>
 <path d="M128 275 h256 v14 h-256z M128 340 h256 v14 h-256z" fill="#153a82" opacity=".6"/>
 <!-- rim -->
 <rect x="112" y="128" width="288" height="44" rx="18" fill="#3b6fd0"/>
 <ellipse cx="256" cy="150" rx="128" ry="26" fill="#1c4aa0"/>
 <!-- liquid seen inside the drum mouth -->
 <ellipse cx="256" cy="150" rx="112" ry="20" fill="url(#liq)"/>
 <ellipse cx="256" cy="147" rx="112" ry="17" fill="#e0a54a" opacity=".55"/>
 <ellipse cx="220" cy="145" rx="40" ry="6" fill="#ffffff" opacity=".35"/>
 <!-- Bamboosa sprig over the rim -->
 <g stroke="#2f7a3f" stroke-width="10" stroke-linecap="round" fill="none"><path d="M352 120 c20-40 50-60 92-66"/><path d="M370 100 c10-30 30-48 60-56"/></g>
 <g fill="#3fa354"><path d="M372 92 c-4-30 14-50 40-54 c4 30-12 52-40 54z"/><path d="M404 68 c0-28 22-44 48-42 c-2 28-22 44-48 42z"/><path d="M340 122 c-10-26 4-46 28-52 c8 26-6 48-28 52z"/></g>
 <!-- droplet leaving the drum → to the crop -->
 <path d="M256 322 c-22 32-34 50-34 66 a34 34 0 0 0 68 0 c0-16-12-34-34-66z" fill="#f4c56a"/>
 <ellipse cx="243" cy="386" rx="7" ry="11" fill="#ffffff" opacity=".45" transform="rotate(-20 243 386)"/>
</svg>
